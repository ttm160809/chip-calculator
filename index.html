<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>籌碼計算器</title>
<style>
:root{
  --bg:#f2f1ec;
  --surface:#ffffff;
  --surface-sunken:#e9e7de;
  --ink:#1c2420;
  --ink-soft:#5b6259;
  --line:#d8d5c9;
  --felt:#0e4d36;
  --felt-ink:#e9f3ee;
  --gold:#a9781f;
  --gold-bg:#f7ecd6;
  --up:#1a6b45;
  --up-bg:#e3f1e8;
  --down:#a1332a;
  --down-bg:#faeae7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171a;
    --surface:#1c2023;
    --surface-sunken:#151819;
    --ink:#eceae4;
    --ink-soft:#9a9d94;
    --line:#31352f;
    --felt:#1c6d4b;
    --felt-ink:#e9f3ee;
    --gold:#d9b463;
    --gold-bg:#332a16;
    --up:#5fbf8f;
    --up-bg:#173226;
    --down:#e08278;
    --down-bg:#3a1f1c;
  }
}
:root[data-theme="dark"]{
  --bg:#14171a;
  --surface:#1c2023;
  --surface-sunken:#151819;
  --ink:#eceae4;
  --ink-soft:#9a9d94;
  --line:#31352f;
  --felt:#1c6d4b;
  --felt-ink:#e9f3ee;
  --gold:#d9b463;
  --gold-bg:#332a16;
  --up:#5fbf8f;
  --up-bg:#173226;
  --down:#e08278;
  --down-bg:#3a1f1c;
}
*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Manrope',-apple-system,'Segoe UI',sans-serif;
  padding:0 16px;
}
.wrap{
  max-width:640px;
  margin:0 auto;
  padding-block:2rem 3rem;
}
h1{
  font-family:'Barlow Condensed',var(--font-voice),sans-serif;
  font-weight:700;
  font-size:34px;
  letter-spacing:0.01em;
  margin:0 0 2px;
  text-wrap:balance;
}
.sub{
  color:var(--ink-soft);
  font-size:14px;
  margin:0 0 1.75rem;
}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:1.25rem 1.25rem;
  margin-bottom:1.25rem;
}
.card h2{
  font-size:12px;
  font-weight:700;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin:0 0 0.9rem;
}
.start-row{
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}
.start-row + .start-row{
  margin-top:10px;
}
.start-row label{
  font-size:15px;
  font-weight:600;
  flex:0 0 auto;
}
.start-row input{
  flex:1 1 160px;
  min-width:0;
}
input[type="number"]{
  width:100%;
  font-family:inherit;
  font-variant-numeric:tabular-nums;
  font-size:17px;
  font-weight:600;
  color:var(--ink);
  background:var(--surface-sunken);
  border:1px solid var(--line);
  border-radius:9px;
  padding:9px 11px;
  -moz-appearance:textfield;
}
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0;
}
input[type="number"]:focus{
  outline:none;
  border-color:var(--felt);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--felt) 22%, transparent);
}
.denom-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}
.denom-row{
  display:grid;
  grid-template-columns:auto 1fr auto auto;
  align-items:center;
  gap:10px;
  padding:8px 4px;
  border-bottom:1px solid var(--line);
}
.denom-row:last-child{border-bottom:none;}
.chip{
  width:30px;
  height:30px;
  border-radius:50%;
  border:3px dashed;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
}
.denom-label{
  font-size:15px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.denom-row input{
  width:96px;
  text-align:right;
}
.subtotal{
  width:100px;
  text-align:right;
  font-variant-numeric:tabular-nums;
  font-size:14px;
  color:var(--ink-soft);
}
.result{
  background:var(--felt);
  color:var(--felt-ink);
  border-radius:14px;
  padding:1.4rem 1.4rem;
  display:flex;
  flex-direction:column;
  gap:1.1rem;
}
.result-top{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:1rem;
}
.result-top .result-block:first-child{
  flex:1 1 auto;
  min-width:110px;
}
.result-pair{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1.25rem;
}
.result-block{min-width:0;}
.result-denom{flex:0 0 auto;text-align:right;}
.result-denom .denom-input{
  width:76px;
  text-align:center;
  font-family:inherit;
  font-variant-numeric:tabular-nums;
  font-size:17px;
  font-weight:700;
  color:var(--felt-ink);
  background:color-mix(in srgb, var(--felt-ink) 12%, transparent);
  border:1px solid color-mix(in srgb, var(--felt-ink) 35%, transparent);
  border-radius:8px;
  padding:6px 8px;
  -moz-appearance:textfield;
}
.result-denom .denom-input::-webkit-outer-spin-button,
.result-denom .denom-input::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0;
}
.result-denom .denom-input:focus{
  outline:none;
  border-color:var(--felt-ink);
}
.result-label{
  font-size:12px;
  font-weight:700;
  letter-spacing:0.08em;
  text-transform:uppercase;
  opacity:0.75;
  margin:0 0 4px;
}
.result-value{
  font-size:28px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  margin:0;
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  font-weight:700;
  padding:3px 10px;
  border-radius:999px;
  margin-top:6px;
}
.badge.up{background:var(--up-bg);color:var(--up);}
.badge.down{background:var(--down-bg);color:var(--down);}
.badge.even{background:var(--gold-bg);color:var(--gold);}
.copy-btn{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin-top:6px;
  background:none;
  border:1px solid color-mix(in srgb, var(--felt-ink) 35%, transparent);
  color:var(--felt-ink);
  font-family:inherit;
  font-size:12px;
  font-weight:600;
  padding:3px 10px;
  border-radius:999px;
  cursor:pointer;
}
.copy-btn:hover{border-color:var(--felt-ink);}
.copy-btn.copied{
  border-color:var(--felt-ink);
  background:color-mix(in srgb, var(--felt-ink) 16%, transparent);
}
.reset{
  display:block;
  margin:1rem auto 0;
  background:none;
  border:1px solid var(--line);
  color:var(--ink-soft);
  font-size:13px;
  font-weight:600;
  font-family:inherit;
  padding:8px 18px;
  border-radius:999px;
  cursor:pointer;
}
.reset:hover{border-color:var(--ink-soft);color:var(--ink);}
.result-divider{
  border:none;
  border-top:1px solid color-mix(in srgb, var(--felt-ink) 18%, transparent);
  margin:0;
}
@media (max-width: 420px){
  h1{font-size:28px;}
  .denom-row{grid-template-columns:auto 1fr auto;grid-template-areas:"chip label label" "chip input subtotal";row-gap:4px;}
  .denom-row .chip{grid-area:chip;}
  .denom-row .denom-label{grid-area:label;}
  .denom-row input{grid-area:input;width:100%;}
  .denom-row .subtotal{grid-area:subtotal;width:auto;}
  .result-value{font-size:24px;}
}
</style>
</head>
<body>

<div class="wrap">
  <h1>籌碼計算器</h1>
  <p class="sub">輸入起始籌碼量、後補籌碼量、各面值數量與借出籌碼量，自動計算目前籌碼量與水上水下。</p>

  <div class="card">
    <h2>基本籌碼</h2>
    <div class="start-row">
      <label for="start">起始籌碼量</label>
      <input type="number" id="start" inputmode="numeric" min="0" step="1" placeholder="0" value="5000">
    </div>
    <div class="start-row">
      <label for="addBuy">後補籌碼量</label>
      <input type="number" id="addBuy" inputmode="numeric" min="0" step="1" placeholder="0" value="0">
    </div>
  </div>

  <div class="card">
    <h2>各面值籌碼數量</h2>
    <div class="denom-grid" id="denomGrid"></div>
  </div>

  <div class="card">
    <h2>借出籌碼</h2>
    <div class="start-row">
      <label for="lendOut">借出籌碼量</label>
      <input type="number" id="lendOut" inputmode="numeric" min="0" step="1" placeholder="0">
    </div>
  </div>

  <div class="result">
    <div class="result-top">
      <div class="result-block">
        <p class="result-label">目前籌碼量</p>
        <p class="result-value" id="totalValue">0</p>
      </div>
      <div class="result-block result-denom">
        <label class="result-label" for="denom">DENOM</label>
        <input type="number" id="denom" class="denom-input" inputmode="decimal" min="0" step="0.1" value="0.1">
      </div>
    </div>
    <hr class="result-divider">
    <div class="result-pair">
      <div class="result-block">
        <p class="result-label">水上 / 水下</p>
        <p class="result-value" id="diffValue">0</p>
        <span class="badge even" id="diffBadge">打平</span>
      </div>
      <div class="result-block">
        <p class="result-label">換算金額</p>
        <p class="result-value" id="amountValue">0</p>
        <button class="copy-btn" id="copyAmountBtn" type="button">複製數值</button>
      </div>
    </div>
  </div>

  <button class="reset" id="resetBtn" type="button">清空重算</button>
</div>

<script>
(function(){
  var DENOMS = [
    {v:5, color:"#c23b3b"},
    {v:10, color:"#2f6fb3"},
    {v:20, color:"#2f7a4f"},
    {v:50, color:"#3a3a3a"},
    {v:100, color:"#7a3fa0"},
    {v:500, color:"#b3862f"},
    {v:1000, color:"#1c8f8f"},
    {v:5000, color:"#a03f7a"}
  ];

  var grid = document.getElementById("denomGrid");
  var frag = document.createDocumentFragment();

  DENOMS.forEach(function(d){
    var row = document.createElement("div");
    row.className = "denom-row";

    var chip = document.createElement("div");
    chip.className = "chip";
    chip.style.borderColor = d.color;

    var label = document.createElement("div");
    label.className = "denom-label";
    label.textContent = "面值 " + d.v.toLocaleString();

    var input = document.createElement("input");
    input.type = "number";
    input.min = "0";
    input.step = "1";
    input.inputMode = "numeric";
    input.placeholder = "0";
    input.id = "qty-" + d.v;
    input.setAttribute("data-denom", d.v);
    input.setAttribute("aria-label", "面值 " + d.v + " 數量");

    var subtotal = document.createElement("div");
    subtotal.className = "subtotal";
    subtotal.id = "sub-" + d.v;
    subtotal.textContent = "= 0";

    row.appendChild(chip);
    row.appendChild(label);
    row.appendChild(input);
    row.appendChild(subtotal);
    frag.appendChild(row);
  });

  grid.appendChild(frag);

  var startInput = document.getElementById("start");
  var addBuyInput = document.getElementById("addBuy");
  var lendOutInput = document.getElementById("lendOut");
  var totalValueEl = document.getElementById("totalValue");
  var diffValueEl = document.getElementById("diffValue");
  var diffBadgeEl = document.getElementById("diffBadge");
  var amountValueEl = document.getElementById("amountValue");
  var denomInput = document.getElementById("denom");
  var copyAmountBtn = document.getElementById("copyAmountBtn");
  var resetBtn = document.getElementById("resetBtn");
  var copyResetTimer = null;

  var STORAGE_KEY = "chip-calc-state-v1";

  function fmt(n){
    return Math.round(n).toLocaleString();
  }

  function fmtAmount(n){
    var rounded = Math.round(n * 10) / 10;
    return rounded.toLocaleString(undefined, {maximumFractionDigits: 1});
  }

  function readQty(denom){
    var el = document.getElementById("qty-" + denom);
    var n = parseFloat(el.value);
    return isNaN(n) || n < 0 ? 0 : n;
  }

  function recalc(){
    var total = 0;
    DENOMS.forEach(function(d){
      var qty = readQty(d.v);
      var subtotal = qty * d.v;
      total += subtotal;
      document.getElementById("sub-" + d.v).textContent = "= " + fmt(subtotal);
    });

    var lendOut = parseFloat(lendOutInput.value);
    if (isNaN(lendOut) || lendOut < 0) lendOut = 0;
    total += lendOut;

    var start = parseFloat(startInput.value);
    if (isNaN(start) || start < 0) start = 0;

    var addBuy = parseFloat(addBuyInput.value);
    if (isNaN(addBuy) || addBuy < 0) addBuy = 0;

    var diff = total - (start + addBuy);

    totalValueEl.textContent = fmt(total);

    if (diff > 0){
      diffValueEl.textContent = "+" + fmt(diff);
      diffBadgeEl.textContent = "水上 " + fmt(diff);
      diffBadgeEl.className = "badge up";
    } else if (diff < 0){
      diffValueEl.textContent = "-" + fmt(Math.abs(diff));
      diffBadgeEl.textContent = "水下 " + fmt(Math.abs(diff));
      diffBadgeEl.className = "badge down";
    } else {
      diffValueEl.textContent = "0";
      diffBadgeEl.textContent = "打平";
      diffBadgeEl.className = "badge even";
    }

    var denomVal = parseFloat(denomInput.value);
    if (isNaN(denomVal)){
      amountValueEl.textContent = "-";
    } else {
      var amount = diff * denomVal;
      if (amount > 0){
        amountValueEl.textContent = "+" + fmtAmount(amount);
      } else if (amount < 0){
        amountValueEl.textContent = "-" + fmtAmount(Math.abs(amount));
      } else {
        amountValueEl.textContent = "0";
      }
    }

    save();
  }

  function save(){
    try{
      var state = {start: startInput.value, addBuy: addBuyInput.value, lendOut: lendOutInput.value, denom: denomInput.value};
      DENOMS.forEach(function(d){
        state["qty-" + d.v] = document.getElementById("qty-" + d.v).value;
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){}
  }

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var state = JSON.parse(raw);
      var savedStart = parseFloat(state.start);
      if (state.start !== undefined && !isNaN(savedStart) && savedStart > 0){
        startInput.value = state.start;
      }
      if (state.addBuy !== undefined) addBuyInput.value = state.addBuy;
      if (state.lendOut !== undefined) lendOutInput.value = state.lendOut;
      var savedDenom = parseFloat(state.denom);
      if (state.denom !== undefined && !isNaN(savedDenom) && savedDenom > 0){
        denomInput.value = state.denom;
      }
      DENOMS.forEach(function(d){
        var key = "qty-" + d.v;
        if (state[key] !== undefined){
          document.getElementById(key).value = state[key];
        }
      });
    }catch(e){}
  }

  function copyAmount(){
    var text = amountValueEl.textContent;

    function showCopied(){
      copyAmountBtn.textContent = "已複製";
      copyAmountBtn.classList.add("copied");
      clearTimeout(copyResetTimer);
      copyResetTimer = setTimeout(function(){
        copyAmountBtn.textContent = "複製數值";
        copyAmountBtn.classList.remove("copied");
      }, 1500);
    }

    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(showCopied).catch(function(){
        fallbackCopy(text, showCopied);
      });
    } else {
      fallbackCopy(text, showCopied);
    }
  }

  function fallbackCopy(text, onDone){
    try{
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      onDone();
    }catch(e){}
  }

  copyAmountBtn.addEventListener("click", copyAmount);

  load();

  startInput.addEventListener("input", recalc);
  addBuyInput.addEventListener("input", recalc);
  lendOutInput.addEventListener("input", recalc);
  denomInput.addEventListener("input", recalc);
  DENOMS.forEach(function(d){
    document.getElementById("qty-" + d.v).addEventListener("input", recalc);
  });

  resetBtn.addEventListener("click", function(){
    startInput.value = "5000";
    addBuyInput.value = "0";
    lendOutInput.value = "";
    denomInput.value = "0.1";
    DENOMS.forEach(function(d){
      document.getElementById("qty-" + d.v).value = "";
    });
    startInput.focus();
    recalc();
  });

  recalc();
})();
</script>
</body>
</html>
